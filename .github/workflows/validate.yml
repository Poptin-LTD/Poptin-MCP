name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_links:
        description: Run the public-link validation step
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Registry, plugins, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository
        run: python scripts/validate.py

      - name: Check public links
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_links }}
        run: python scripts/validate.py --check-links
