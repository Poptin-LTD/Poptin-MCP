name: Dify plugin tests
on:
  push:
    paths:
      - 'integrations/dify/**'
      - '.github/workflows/dify-plugin.yml'
  pull_request:
    paths:
      - 'integrations/dify/**'
      - '.github/workflows/dify-plugin.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/dify/poptin/requirements.txt pytest==9.2.0
      - run: python -m pytest integrations/dify/tests -q
