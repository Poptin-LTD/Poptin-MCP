identity:
  name: list_poptins
  author: poptins
  label:
    en_US: List popups and forms
description:
  human:
    en_US: Browse one page of popups and forms with aggregate metrics over inclusive
      UTC reporting dates.
  llm: Browse one page of popups and forms with aggregate metrics over inclusive UTC
    reporting dates.
parameters:
- name: device
  type: string
  required: false
  label:
    en_US: Device
  human_description:
    en_US: 'Optional device: desktop or mobile. Omit for all.'
  llm_description: 'Optional device: desktop or mobile. Omit for all.'
  form: llm
- name: domain
  type: string
  required: false
  label:
    en_US: Domain
  human_description:
    en_US: Exact domain filter within your account; never used as a network destination.
  llm_description: Exact domain filter within your account; never used as a network
    destination.
  form: llm
- name: page
  type: number
  required: false
  label:
    en_US: Page
  human_description:
    en_US: 'Positive page number. Default: 1.'
  llm_description: 'Positive page number. Default: 1.'
  form: llm
- name: per_page
  type: number
  required: false
  label:
    en_US: Per page
  human_description:
    en_US: 'Results per page, from 1 to 100. API default: 10.'
  llm_description: 'Results per page, from 1 to 100. API default: 10.'
  form: llm
- name: stat_from
  type: string
  required: true
  label:
    en_US: Stat from
  human_description:
    en_US: Inclusive UTC reporting start date, YYYY-MM-DD.
  llm_description: Inclusive UTC reporting start date, YYYY-MM-DD.
  form: llm
- name: stat_to
  type: string
  required: true
  label:
    en_US: Stat to
  human_description:
    en_US: Inclusive UTC reporting end date, YYYY-MM-DD.
  llm_description: Inclusive UTC reporting end date, YYYY-MM-DD.
  form: llm
- name: type
  type: string
  required: false
  label:
    en_US: Type
  human_description:
    en_US: 'Optional product type: popup or form. Omit for both.'
  llm_description: 'Optional product type: popup or form. Omit for both.'
  form: llm
extra:
  python:
    source: tools/list_poptins.py
